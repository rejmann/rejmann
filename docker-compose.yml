services:
  app:
    build:
      context: .
      dockerfile: devops/Dockerfile
    env_file:
      - path: .env
        required: false   # `make svg` usa este serviço e não precisa de credenciais
    working_dir: /app
    command: python3 cli/today.py
    volumes:
      - .:/app

  fetch:
    build:
      context: .
      dockerfile: devops/Dockerfile
    env_file:
      - .env
    working_dir: /app
    command: python3 cli/fetch_stats.py
    volumes:
      - .:/app

  debug:
    build:
      context: .
      dockerfile: devops/Dockerfile
    env_file:
      - .env
    working_dir: /app
    stdin_open: true
    tty: true
    command: bash
    volumes:
      - .:/app
