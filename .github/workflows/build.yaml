name: README build
on:
  push:
    branches:
      - main
  schedule:
    # 06:00 UTC = 03:00 America/Sao_Paulo (Brasil não tem horário de verão desde 2019)
    - cron: "0 6 * * *"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # necessário para o git push do README atualizado
    timeout-minutes: 10 # cancela o job (falho) se passar disso, em vez de deixar rodando; um rescan completo do LOC (sem cache) leva ~3 min
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: cache/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python cli/today.py
      # roda mesmo se a coleta de stats falhar, para que mudanças de layout no
      # panel.yaml / *_mode.txt sempre cheguem aos SVGs (com os números atuais do YAML)
      - name: Render SVGs
        if: ${{ !cancelled() }}
        run: make svg
      - name: Commit
        if: ${{ !cancelled() }}
        run: |-
          git add .
          git diff
          git config --global user.email "github-actions-bot@rejmann.github.io"
          git config --global user.name "Rejman/GitHub-Actions-Bot"
          git commit -m "docs: Updated README" -a || echo "No changes to commit"
          git push
