# ── Painel compartilhado dos SVGs de perfil ──────────────────────────────────
# Fonte da verdade dos dois temas (dark_mode.svg e light_mode.svg). Os SVGs são
# saída de build: `make svg` apaga os dois e os recria do zero a partir deste
# arquivo (painel + cores em `themes:`) e de dark_mode.txt / light_mode.txt
# (arte ASCII). Nunca edite os .svg à mão — a próxima geração descarta.
#
# Os campos vindos do GitHub — o `value:` de cada item em `fields:` e o da linha
# "Uptime" — são reescritos automaticamente pelo today.py (`make setup` / `make publish`
# e o CI), que busca os números, grava aqui e regenera os SVGs.
#
#   key    -> rótulo; use ponto para subníveis: "Languages.Programming"
#   value  -> texto exibido; o pontilhado é calculado para alinhar a coluna
#   id     -> (opcional) liga o campo aos hooks do today.py; o value serve de
#             ponto de partida e é reescrito pelo today.py
#   spacer -> linha em branco dentro da seção
#   raw    -> conteúdo SVG cru da linha (escape hatch; raramente necessário)
#
# Seção com `fields:` (GitHub Stats) — as linhas viram templates de texto:
#   {k:Texto}       -> rótulo colorido
#   {Rótulo:campo}  -> rótulo + pontilhado + valor (campo definido em `fields`)
#   {campo}         -> só o valor (com pontilhado se o campo tiver `dots: true`)
# Ajuste rótulos/ordem/separadores nas `rows`; o `value:` de cada campo é
# reescrito pelo today.py. O pontilhado replica o justify_format do today.py.

header: "rejman@root"     # título antes da régua tracejada
birthday: "1998-08-21"          # YYYY-MM-DD; o today.py calcula a linha "Uptime" a partir daqui
width: 60                       # largura mínima (em colunas) do alinhamento;
                                # se algum value passar disso, o painel e o
                                # canvas dos SVGs crescem sozinhos pra caber

themes:                         # um <modo>_mode.svg por tema (arte em <modo>_mode.txt)
  dark:
    background: "#161b22"
    text:       "#c9d1d9"       # arte ASCII e texto sem classe (réguas, chaves)
    key:        "#ffa657"
    value:      "#a5d6ff"
    addColor:   "#3fb950"
    delColor:   "#f85149"
    cc:         "#616e7f"       # pontilhado e prefixo ". "
  light:
    background: "#f6f8fa"
    text:       "#24292f"
    key:        "#953800"
    value:      "#0a3069"
    addColor:   "#1a7f37"
    delColor:   "#cf222e"
    cc:         "#c2cfde"

sections:
  - title: null                 # a primeira seção não tem cabeçalho
    rows:
      - { key: "OS",     value: "Windows 11, Android 16, Linux" }
      - { key: "Uptime", value: "28 years, 0 months, 21 days", id: age_data }
      - { key: "Host",   value: "Codarme Sistemas, Ltda" }
      - { key: "Kernel", value: "Developer" }
      - { key: "IDE",    value: "VSCode" }
      - spacer
      - { key: "Languages.Programming", value: "PHP, Typescript, Go" }
      - { key: "Languages.Computer",    value: "HTML, CSS, JSON, YAML" }
      - { key: "Languages.Real",        value: "Portuguese (native), English (learning)" }
      - spacer
      - { key: "Hobbies.Software", value: "Valorant" }

  - title: "Contact"
    rows:
      - { key: "Email.Personal", value: "rejman.dev@gmail.com" }
      - { key: "LinkedIn",       value: "nascimentorejman" }

  - title: "GitHub Stats"
    fields:                       # contrato com o today.py — mexa só se ele mudar
      repo_data:     { value: "46",      length: 6,  dots: true }
      contrib_data:  { value: "69" }
      star_data:     { value: "4",     length: 14, dots: true }
      commit_data:   { value: "5,278",   length: 22, dots: true }
      follower_data: { value: "23",     length: 10, dots: true }
      loc_data:      { value: "4,112,939", length: 9,  dots: true }
      loc_add:       { value: "10,308,873", class: addColor, suffix: "++" }
      loc_del:       { value: "6,195,934",  class: delColor, suffix: "--", length: 7, dots: true, dots_class: "" }
    rows:
      - "{Repos:repo_data} {{k:Contributed}: {contrib_data}}"
      - "{Stars:star_data}"
      - "{Followers:follower_data}"
      - "{Commmits:commit_data}"
      - "{Lines of Code on GitHub:loc_data}"
      - "{k:Diff}: {loc_add}, {loc_del}"
