# ── Painel compartilhado dos SVGs de perfil ──────────────────────────────────
# Preencha os valores abaixo e rode `make panel` (ou `make svg`, que também
# regenera a arte ASCII). Os dois temas — dark_mode.svg e light_mode.svg — são
# atualizados juntos a partir deste arquivo.
#
#   key    -> rótulo; use ponto para subníveis: "Languages.Programming"
#   value  -> texto exibido; o pontilhado é calculado para alinhar a coluna
#   id     -> (opcional) marca o campo como preenchido pelo today.py no CI;
#             o value aqui vira só um placeholder de pré-visualização local
#   spacer -> linha em branco dentro da seção
#   raw    -> conteúdo SVG cru da linha (usado na seção GitHub Stats, cujos
#             números o today.py injeta pelos ids — não precisa mexer)

header: "rejman@root"     # título antes da régua tracejada
width: 60                       # largura mínima (em colunas) do alinhamento;
                                # se algum value passar disso, o painel e o
                                # canvas dos SVGs crescem sozinhos pra caber

sections:
  - title: null                 # a primeira seção não tem cabeçalho
    rows:
      - { key: "OS",     value: "Windows 11, Android 16, Linux" }
      - { key: "Uptime", value: "28 years", id: age_data }
      - { key: "Host",   value: "Codarme Sistemas, Ltda" }
      - { key: "Kernel", value: "Developer" }
      - { key: "IDE",    value: "VSCode" }
      - spacer
      - { key: "Languages.Programming", value: "PHP, Typescript, Go" }
      - { key: "Languages.Computer",    value: "HTML, CSS, JSON, YAML" }
      - { key: "Languages.Real",        value: "Portuguese (native), English (learning)" }
      - spacer
      - { key: "Hobbies.Software", value: "Valorant" }

  - title: "Contact"
    rows:
      - { key: "Email.Personal", value: "rejman.dev@gmail.com" }
      - { key: "LinkedIn",       value: "nascimentorejman" }

  - title: "GitHub Stats"
    rows:
      - raw: '<tspan class="key">Repos</tspan>:<tspan class="cc" id="repo_data_dots"> .... </tspan><tspan class="value" id="repo_data">95</tspan> {<tspan class="key">Contributed</tspan>: <tspan class="value" id="contrib_data">133</tspan>} | <tspan class="key">Stars</tspan>:<tspan class="cc" id="star_data_dots"> ........... </tspan><tspan class="value" id="star_data">342</tspan>'
      - raw: '<tspan class="key">Commmits</tspan>:<tspan class="cc" id="commit_data_dots"> ................. </tspan><tspan class="value" id="commit_data">2,116</tspan> | <tspan class="key">Followers</tspan>:<tspan class="cc" id="follower_data_dots"> ....... </tspan><tspan class="value" id="follower_data">196</tspan>'
      - raw: '<tspan class="key">Lines of Code on GitHub</tspan>:<tspan class="cc" id="loc_data_dots">. </tspan><tspan class="value" id="loc_data">446,276</tspan> ( <tspan class="addColor" id="loc_add">523,178</tspan><tspan class="addColor">++</tspan>, <tspan id="loc_del_dots"> </tspan><tspan class="delColor" id="loc_del">76,902</tspan><tspan class="delColor">--</tspan> )'
